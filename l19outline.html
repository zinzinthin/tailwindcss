<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <button type="button" class="border outline-none">Button</button>
    <button type="button" class="border outline-hidden">Button</button>
    <button type="button" class="border outline">Button</button>
    <button type="button" class="border outline-double">Button</button>
</body>
</html>
