<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <p class="underline decoration-0">This is sample text</p>
    <p class="underline decoration-1">This is sample text</p>
    <p class="underline decoration-2">This is sample text</p>
    <p class="underline decoration-4">This is sample text</p>
    <p class="underline decoration-8">This is sample text</p>

</body>

</html>

Note : must have text-decoration

decoration-0
decoration-1
decoration-2
decoration-4
decoration-8


-->
