<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline Width</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <button type="button" class="border-4 outline outline-0 m-5">Button</button>
    <button type="button" class="border-4 outline outline-1 m-5">Button</button>
    <button type="button" class="border-4 outline outline-2 m-5">Button</button>
    <button type="button" class="border-4 outline outline-4 m-5">Button</button>
    <button type="button" class="border-4 outline outline-8 m-5">Button</button>
</body>
</html>
