<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <p class="no-underline">This is sample text</p>
    <p class="underline">This is sample text</p>
    <p class="line-through">This is sample text</p>
    <p class="overline">This is sample text</p>
    <hr />

    <h1>Hover</h1>
    <p class="underline hover:no-underline">Hey! Hover Me</p>
    <p class="underline md:line-through">Hey! I am italic font on medium screen and larger...</p>
</body>

</html>
